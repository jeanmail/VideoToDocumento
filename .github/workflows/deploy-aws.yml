name: CD - Deploy to AWS ECS Fargate

on:
  workflow_run:
    workflows: ["CI/CD Pipeline - Build Docker & Tests"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch: # Permite disparo manual via interface do GitHub

jobs:
  deploy-aws-ecs:
    name: Deploy to Amazon ECS Fargate
    # Executa apenas se o build do Docker na main concluiu com sucesso
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Validate AWS Secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECS_CLUSTER: ${{ secrets.ECS_CLUSTER }}
          ECS_SERVICE: ${{ secrets.ECS_SERVICE }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "❌ ERRO: Secrets da AWS não configuradas no GitHub!"
            echo "Configure em Settings -> Secrets and variables -> Actions:"
            echo "  - AWS_ACCESS_KEY_ID"
            echo "  - AWS_SECRET_ACCESS_KEY"
            echo "  - AWS_REGION (ex: us-east-1)"
            echo "  - ECS_CLUSTER (nome do cluster ECS)"
            echo "  - ECS_SERVICE (nome do serviço ECS)"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Trigger ECS Service Force New Deployment
        run: |
          echo "🚀 Disparando atualização do serviço ECS Fargate com a nova imagem..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.ECS_SERVICE }}" \
            --force-new-deployment

          echo "✅ Deploy disparado com sucesso no AWS ECS Fargate!"
